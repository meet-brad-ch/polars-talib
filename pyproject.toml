[project]
name = "polars-talib"
version = "0.0.0"  # placeholder: CI sets the version from the release tag, see ci.yml
description = "TA-Lib for Polars expressions, driven by TA-Lib's own function metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["polars>=1.0"]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polars_talib._polars_talib"
features = ["pyo3/extension-module"]

# Rebuild the extension when any of its sources change, not only pyproject.toml.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "build.rs" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "ta-lib/VERSION" },
]

[dependency-groups]
dev = [
    "maturin>=1.15,<2",
    "mypy>=1.18",
    "numpy>=2",
    "pytest>=8",
    "ruff>=0.13",
    "ta-lib==0.7.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["ta-lib"]

[tool.ruff.format]
exclude = ["*.pyi"]  # generated by polars_talib._stubs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["polars_talib", "data"]

[tool.ruff.lint.per-file-ignores]
"*.pyi" = ["E501"]  # generated: TA-Lib's parameter hints set the line length

[tool.mypy]
strict = true
files = ["python", "tests"]

# ta-lib-python is untyped; take it as Any.
[[tool.mypy.overrides]]
module = ["talib", "talib.*"]
follow_imports = "skip"
